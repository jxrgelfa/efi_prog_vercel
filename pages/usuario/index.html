<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Comprador — FeriaZone</title>
  <!-- Favicon / Icono del tabulador del navegador -->
  <link rel="icon" type="image/png" href="../../images/logo.png">
  <link rel="apple-touch-icon" href="../../images/logo.png">
  <link rel="shortcut icon" href="../../favicon.ico">
  
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('fz_theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-accent selection:text-white bg-[#E2EBF1] dark:bg-[#121A2C] text-ink dark:text-white transition-colors">

  <div id="navbar-placeholder"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full space-y-6">
    
    <!-- Breadcrumb de navegación rápida al Inicio -->
    <nav class="flex items-center gap-2 text-xs font-semibold text-ink-muted dark:text-slate-400">
      <a href="../../index.html" class="hover:text-accent flex items-center gap-1.5 transition-colors">
        <svg class="w-4 h-4 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
        </svg>
        <span>Inicio</span>
      </a>
      <span class="text-sand-dark">/</span>
      <span class="text-ink dark:text-white">Panel del Vecino Comprador</span>
    </nav>

    <!-- Header del Panel -->
    <div class="card-surface p-6 sm:p-8 border border-sand/40 flex flex-col sm:flex-row items-center justify-between gap-6">
      <div class="flex items-center space-x-4">
        <img id="user-avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80" alt="Usuario" class="w-16 h-16 rounded-2xl object-cover border-2 border-accent shadow-sm">
        <div>
          <span class="text-xs font-bold text-accent uppercase tracking-wider">Panel del Vecino Comprador</span>
          <h1 id="user-name" class="text-2xl sm:text-3xl font-black text-[#1E2B55] dark:text-[#A7BFD4] font-heading"></h1>
          <p id="user-email" class="text-xs text-ink-muted dark:text-slate-400"></p>
        </div>
      </div>

      <div class="flex flex-wrap gap-2.5">
        <a href="../../index.html" class="btn-outline text-xs py-2.5 px-4 font-bold flex items-center gap-1.5 shadow-xs hover:border-accent hover:text-accent transition-all cursor-pointer">
          <svg class="w-4 h-4 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
          </svg>
          <span>Volver al Inicio</span>
        </a>
        <a href="../tienda.html" class="btn-accent text-xs py-2.5 px-4 font-bold shadow-sm">
          Ir a la Tienda
        </a>
      </div>
    </div>

    <!-- SECCIÓN: Historial de Pedidos -->
    <section class="space-y-4">
      <h2 class="text-xl font-bold text-[#1E2B55] dark:text-[#A7BFD4] font-heading">
        Mis Pedidos Realizados
      </h2>
      <div id="orders-list-container" class="space-y-3">
        <!-- Inyección dinámica -->
      </div>
    </section>

    <!-- SECCIÓN: Dejar Reseña -->
    <section class="card-surface p-6 sm:p-8 space-y-6 border border-sand/40 max-w-2xl">
      <div>
        <h2 class="text-xl font-bold text-[#1E2B55] dark:text-[#A7BFD4] font-heading">
          Dejar una Reseña de Producto o Feria
        </h2>
        <p class="text-xs text-ink-muted dark:text-slate-400 mt-1">
          Tu opinión ayuda a los artesanos y a otros vecinos de Río Cuarto.
        </p>
      </div>

      <form id="review-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-ink dark:text-white mb-1">¿Qué querés calificar?</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="flex items-center space-x-2 p-2.5 rounded-xl border border-sand/60 bg-sand/10 cursor-pointer">
              <input type="radio" name="review-type" value="product" checked class="text-accent">
              <span class="text-xs font-bold text-ink dark:text-white">Un Producto</span>
            </label>
            <label class="flex items-center space-x-2 p-2.5 rounded-xl border border-sand/60 bg-sand/10 cursor-pointer">
              <input type="radio" name="review-type" value="fair" class="text-accent">
              <span class="text-xs font-bold text-ink dark:text-white">Una Feria Asistida</span>
            </label>
          </div>
        </div>

        <div id="product-select-group">
          <label for="review-target" class="block text-xs font-bold text-ink dark:text-white mb-1">Elegir Ítem</label>
          <select id="review-target" class="w-full px-4 py-2 rounded-xl border border-sand/60 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm">
            <!-- Dinámico -->
          </select>
        </div>

        <div>
          <label for="review-rating" class="block text-xs font-bold text-ink dark:text-white mb-1">Puntuación</label>
          <select id="review-rating" class="w-full px-4 py-2 rounded-xl border border-sand/60 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm">
            <option value="5">5 estrellas — Excelente</option>
            <option value="4">4 estrellas — Muy bueno</option>
            <option value="3">3 estrellas — Bueno</option>
            <option value="2">2 estrellas — Regular</option>
            <option value="1">1 estrella — Malo</option>
          </select>
        </div>

        <div>
          <label for="review-comment" class="block text-xs font-bold text-ink dark:text-white mb-1">Tu Comentario</label>
          <textarea id="review-comment" rows="3" required placeholder="Contá qué te pareció la calidad, la atención y el producto..." class="w-full px-4 py-2.5 rounded-xl border border-sand/60 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm"></textarea>
        </div>

        <button type="submit" class="btn-accent py-2.5 px-6 text-sm font-bold shadow-sm cursor-pointer">
          Publicar Reseña
        </button>
      </form>
    </section>

  </main>

  <div id="footer-placeholder"></div>

  <script type="module">
    import { renderNavbar } from '../../js/components/navbar.js';
    import { renderFooter } from '../../js/components/footer.js';
    import { auth } from '../../js/services/auth.js';
    import { dataService } from '../../js/services/dataService.js';
    import { formatCurrency } from '../../js/utils/formatters.js';
    import { showToast } from '../../js/components/toast.js';

    document.addEventListener('DOMContentLoaded', () => {
      // Guard de ruta: solo rol 'usuario'
      if (!auth.requireAuth(['usuario'], '../login.html')) return;

      renderNavbar();
      renderFooter();

      const user = auth.getCurrentUser();
      document.getElementById('user-name').textContent = user.name;
      document.getElementById('user-email').textContent = user.email;
      document.getElementById('user-avatar').src = user.avatar;

      // Renderizar pedidos
      const orders = dataService.getOrders();
      const ordersContainer = document.getElementById('orders-list-container');
      if (orders.length === 0) {
        ordersContainer.innerHTML = '<p class="text-xs text-ink-muted">Aún no realizaste ningún pedido simulado.</p>';
      } else {
        ordersContainer.innerHTML = orders.map(ord => `
          <div class="card-surface p-4 sm:p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border border-sand/30">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <span class="font-bold text-sm text-[#1E2B55] dark:text-[#A7BFD4] font-heading">Orden: ${ord.id}</span>
                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-moss/20 text-moss-dark dark:bg-moss/30 dark:text-moss-light">${ord.status}</span>
              </div>
              <p class="text-xs text-ink-muted dark:text-slate-400">Fecha: ${ord.date} · ${ord.pickupMethod || 'Retiro acordado'}</p>
              <ul class="text-xs text-ink dark:text-slate-200 mt-2 list-disc list-inside">
                ${ord.items.map(it => `<li>${it.quantity}x ${it.name} (${formatCurrency(it.price)})</li>`).join('')}
              </ul>
            </div>
            <div class="text-right sm:text-right w-full sm:w-auto">
              <span class="text-xs text-ink-light block">Total</span>
              <span class="text-lg font-black text-accent font-heading">${formatCurrency(ord.total)}</span>
            </div>
          </div>
        `).join('');
      }

      // Selector de ítems para reseña
      const targetSelect = document.getElementById('review-target');
      const radioTypes = document.querySelectorAll('input[name="review-type"]');
      const products = dataService.getProducts();
      const fairs = dataService.getFairs();

      function updateOptions(type) {
        if (type === 'product') {
          targetSelect.innerHTML = products.map(p => `<option value="${p.id}">${p.name} (${p.merchantName})</option>`).join('');
        } else {
          targetSelect.innerHTML = fairs.map(f => `<option value="${f.id}">${f.name}</option>`).join('');
        }
      }

      radioTypes.forEach(r => {
        r.addEventListener('change', () => updateOptions(r.value));
      });
      updateOptions('product');

      // Submit de reseña
      document.getElementById('review-form')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const type = document.querySelector('input[name="review-type"]:checked').value;
        const targetId = targetSelect.value;
        const rating = parseInt(document.getElementById('review-rating').value, 10);
        const comment = document.getElementById('review-comment').value;

        const newReview = {
          author: user.name,
          rating,
          comment
        };

        if (type === 'product') {
          newReview.productId = targetId;
        } else {
          newReview.fairId = targetId;
        }

        dataService.addReview(type, newReview);
        showToast('¡Tu reseña fue publicada con éxito!', 'success');
        document.getElementById('review-comment').value = '';
      });
    });
  </script>
</body>
</html>
