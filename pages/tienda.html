<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda de Productos Artesanales — FeriaZone</title>
  <!-- Favicon / Icono del tabulador del navegador -->
  <link rel="icon" type="image/png" href="../images/logo.png">
  <link rel="apple-touch-icon" href="../images/logo.png">
  <link rel="shortcut icon" href="../favicon.ico">
  
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('fz_theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-accent selection:text-white bg-[#E2EBF1] dark:bg-[#121A2C] text-ink dark:text-white transition-colors">

  <div id="navbar-placeholder"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10 flex-grow w-full space-y-8">
    
    <!-- Encabezado de página -->
    <div class="border-b border-sand/30 pb-6 flex flex-col md:flex-row md:items-end justify-between gap-4">
      <div>
        <span class="text-xs font-bold text-accent uppercase tracking-widest">Mercado Riocuartense</span>
        <h1 class="text-3xl sm:text-4xl font-black text-[#1E2B55] dark:text-[#A7BFD4] font-heading mt-1">
          Tienda de Productos
        </h1>
        <p class="text-sm text-ink-muted dark:text-slate-300 mt-1">
          Comprá directo al artesano. Los productos con promoción activa aparecen destacados al inicio.
        </p>
      </div>

      <!-- Conteo de resultados -->
      <div id="catalog-count" class="text-sm font-semibold text-primary dark:text-sand-light bg-sand/30 dark:bg-slate-800 px-4 py-2 rounded-xl">
        Cargando productos...
      </div>
    </div>

    <!-- ============================================== -->
    <!-- CARRUSEL DE FERIANTES DESTACADOS (INSTAGRAM STORIES) -->
    <!-- ============================================== -->
    <section class="pt-1 pb-2">
      <div id="featured-merchants-container">
        <!-- Renderizado dinámico vía featuredMerchants.js -->
      </div>
    </section>

    <!-- Barra de Filtros y Búsqueda -->
    <div class="card-surface p-4 sm:p-5 space-y-4 border border-sand/40 transition-all">
      
      <!-- Barra superior: Título, badges y botón de mostrar/ocultar filtros -->
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-sand/30 dark:bg-slate-800 text-accent flex items-center justify-center">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
            </svg>
          </div>
          <div>
            <h2 class="text-sm sm:text-base font-bold text-ink dark:text-white font-heading leading-tight">
              Filtros
            </h2>
            <p class="text-xs text-ink-muted dark:text-slate-400 hidden sm:block">
              Encontrá artesanías por categoría, feria o precio
            </p>
          </div>
          <span id="active-filters-badge" class="hidden text-xs bg-accent text-white font-bold px-2.5 py-0.5 rounded-full shadow-2xs">
            0 activos
          </span>
        </div>

        <button 
          id="toggle-filters-btn" 
          type="button" 
          aria-expanded="true" 
          aria-controls="filters-content"
          class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold text-ink dark:text-slate-100 bg-sand/30 dark:bg-slate-800 hover:bg-sand/60 dark:hover:bg-slate-700 transition-all cursor-pointer min-h-[44px]"
        >
          <span id="toggle-filters-text">Ocultar filtros</span>
          <svg id="toggle-filters-icon" class="w-4 h-4 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
          </svg>
        </button>
      </div>

      <!-- Contenedor desplegable de filtros -->
      <div id="filters-content" class="space-y-4 pt-1 transition-all duration-300">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 items-end">
          
          <!-- Buscador por texto -->
          <div class="space-y-1">
            <label for="filter-search" class="text-xs font-bold text-ink dark:text-slate-200">Buscar por nombre o palabra clave</label>
            <input 
              type="text" 
              id="filter-search" 
              placeholder="Ej: mate imperial, alfajor, cazuela..."
              class="w-full px-4 py-2.5 rounded-xl border border-sand/60 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm text-ink dark:text-white focus:outline-hidden focus:ring-2 focus:ring-accent"
            >
          </div>

          <!-- Filtro por Categoría -->
          <div class="space-y-1">
            <label for="filter-category" class="text-xs font-bold text-ink dark:text-slate-200">Rubro / Categoría</label>
            <select 
              id="filter-category"
              class="w-full px-4 py-2.5 rounded-xl border border-sand/60 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm text-ink dark:text-white focus:outline-hidden focus:ring-2 focus:ring-accent">
              <option value="all">Todas las categorías</option>
              <option value="Mates y Cuero">Mates y Cuero</option>
              <option value="Cerámica y Vajilla">Cerámica y Vajilla</option>
              <option value="Alimentos y Conservas">Alimentos y Conservas</option>
              <option value="Textiles y Tejidos">Textiles y Tejidos</option>
              <option value="Cosmética Natural">Cosmética Natural</option>
              <option value="Artesanías en Madera">Artesanías en Madera</option>
              <option value="Plantas y Jardinería">Plantas y Jardinería</option>
              <option value="Joyería y Metales">Joyería y Metales</option>
              <option value="Papelería y Cuadernos">Papelería y Cuadernos</option>
              <option value="Bebidas Artesanales">Bebidas Artesanales</option>
            </select>
          </div>

          <!-- Filtro por Feria habitual (sin label redundante) -->
          <div class="space-y-1">
            <select 
              id="filter-fair"
              aria-label="Feria de Origen"
              class="w-full px-4 py-2.5 rounded-xl border border-sand/60 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm text-ink dark:text-white focus:outline-hidden focus:ring-2 focus:ring-accent">
              <option value="all">Todas las ferias de Río Cuarto</option>
              <option value="feria-1">Feria Parque Sarmiento</option>
              <option value="feria-2">Paseo de Ferias del Andino</option>
              <option value="feria-3">Feria Verde de la Costanera</option>
              <option value="feria-4">Paseo Plaza Roca Emprende</option>
              <option value="feria-5">Feria Barrio Alberdi</option>
              <option value="feria-6">Eco-Encuentro Villa Dalcar</option>
            </select>
          </div>

          <!-- Ordenamiento -->
          <div class="space-y-1">
            <label for="filter-sort" class="text-xs font-bold text-ink dark:text-slate-200">Ordenar por</label>
            <select 
              id="filter-sort"
              class="w-full px-4 py-2.5 rounded-xl border border-sand/60 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm text-ink dark:text-white focus:outline-hidden focus:ring-2 focus:ring-accent">
              <option value="promoted-first">Destacados primero</option>
              <option value="price-asc">Precio: Menor a Mayor</option>
              <option value="price-desc">Precio: Mayor a Menor</option>
              <option value="name-asc">Nombre (A - Z)</option>
            </select>
          </div>

        </div>

        <!-- Botón limpiar filtros -->
        <div class="flex justify-end pt-1">
          <button id="clear-filters-btn" class="text-xs text-accent font-semibold hover:underline cursor-pointer min-h-[32px] inline-flex items-center">
            Restablecer todos los filtros
          </button>
        </div>
      </div>
    </div>

    <!-- Grilla de Productos -->
    <div id="catalog-products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Se inyectan dinámicamente -->
    </div>

  </main>

  <div id="footer-placeholder"></div>

  <script type="module" src="../js/pages/tienda.js"></script>
</body>
</html>
