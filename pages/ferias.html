<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guía de Ferias de Río Cuarto — FeriaZone</title>
  <!-- Favicon / Icono del tabulador del navegador -->
  <link rel="icon" type="image/png" href="../images/logo.png">
  <link rel="apple-touch-icon" href="../images/logo.png">
  <link rel="shortcut icon" href="../favicon.ico">
  
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('fz_theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-accent selection:text-white bg-[#E2EBF1] dark:bg-[#121A2C] text-ink dark:text-white transition-colors">

  <div id="navbar-placeholder"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full space-y-8">
    
    <div class="border-b border-sand/30 pb-6 flex flex-col md:flex-row md:items-end justify-between gap-4">
      <div>
        <span class="text-xs font-bold text-accent uppercase tracking-widest">Encuentros Populares</span>
        <h1 class="text-3xl sm:text-4xl font-black text-[#1E2B55] dark:text-[#A7BFD4] font-heading mt-1">
          Guía de Ferias de Río Cuarto
        </h1>
        <p class="text-sm text-ink-muted dark:text-slate-300 mt-1">
          Espacios culturales y comerciales al aire libre. Parque Sarmiento, Paseo del Andino, Costanera y más.
        </p>
      </div>

      <a href="./mapa.html" class="btn-primary text-sm py-2.5 px-4 flex items-center gap-2 self-start md:self-auto cursor-pointer">
        <svg class="w-4 h-4 text-white flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path>
        </svg>
        <span>Ver todas en el Mapa</span>
      </a>
    </div>

    <!-- Filtros de ferias -->
    <div class="flex flex-wrap items-center gap-2">
      <button data-filter="all" class="fair-filter-btn px-4 py-2 rounded-xl text-xs font-bold bg-accent text-white shadow-xs cursor-pointer">
        Todas (6)
      </button>
      <button data-filter="activa" class="fair-filter-btn px-4 py-2 rounded-xl text-xs font-bold bg-sand/30 dark:bg-slate-800 text-ink dark:text-white hover:bg-sand/60 cursor-pointer">
        En Curso
      </button>
      <button data-filter="proxima" class="fair-filter-btn px-4 py-2 rounded-xl text-xs font-bold bg-sand/30 dark:bg-slate-800 text-ink dark:text-white hover:bg-sand/60 cursor-pointer">
        Próximas Ediciones
      </button>
    </div>

    <!-- Grilla de ferias -->
    <div id="fairs-list-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Se inyecta dinámicamente -->
    </div>

  </main>

  <div id="footer-placeholder"></div>

  <script type="module" src="../js/pages/ferias.js"></script>
</body>
</html>
