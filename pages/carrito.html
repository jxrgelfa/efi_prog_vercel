<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de Compras y Pedido — FeriaZone</title>
  <!-- Favicon / Icono del tabulador del navegador -->
  <link rel="icon" type="image/png" href="../images/logo.png">
  <link rel="apple-touch-icon" href="../images/logo.png">
  <link rel="shortcut icon" href="../favicon.ico">
  
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('fz_theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-accent selection:text-white bg-[#E2EBF1] dark:bg-[#121A2C] text-ink dark:text-white transition-colors">

  <div id="navbar-placeholder"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full space-y-8">
    
    <div>
      <h1 class="text-3xl sm:text-4xl font-black text-[#1E2B55] dark:text-[#A7BFD4] font-heading">
        Tu Carrito de Compras
      </h1>
      <p class="text-sm text-ink-muted dark:text-slate-300 mt-1">
        Revisá tus productos artesanales antes de confirmar el pedido simulado.
      </p>
    </div>

    <div id="cart-content-wrapper">
      <!-- Se inyecta contenido del carrito o estado vacío -->
    </div>

  </main>

  <div id="footer-placeholder"></div>

  <script type="module" src="../js/pages/carrito.js"></script>
</body>
</html>
